name: Build Kernel - lmi

on:
  workflow_dispatch:

jobs:
  build:
    name: Build lmi (KSU)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout CI
      uses: actions/checkout@v4

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Clone Kernel Source (GitLab)
      run: |
        git clone --depth=1 -b android16-aptusitu \
          https://gitlab.com/kaixenberg/android_kernel_xiaomi_sm8250.git kernel

    - name: Clone Submodules (KernelSU-Next & Baseband-guard)
      run: |
        git clone --depth=1 -b legacy https://github.com/sidex15/KernelSU-Next.git ksn
        git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git kbg
        ln -sfn $PWD/ksn/kernel kernel/drivers/kernelsu
        ln -sfn $PWD/kbg kernel/security/baseband-guard
        echo "--- 校验 ---"
        ls kernel/drivers/kernelsu/Kconfig kernel/security/baseband-guard/Kconfig

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3
        sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Apply Custom Optimizations
      run: |
        cd kernel
        python3 - <<'PYEOF'
        p = "build.sh"
        s = open(p).read()
        anchor = 'echo "MIUI-specific configs applied" >> "$LOG_FILE"'
        inject = anchor + '''

          # === custom perf opts (low risk, debug only) ===
          scripts/config --file out/.config \
            -d DEBUG_KERNEL \
            -d SCHED_DEBUG \
            -d DEBUG_SPINLOCK \
            -d DEBUG_MUTEXES \
            -d DEBUG_LOCK_ALLOC \
            -d PROVE_LOCKING \
            -d PROFILING \
            -e CC_OPTIMIZE_FOR_PERFORMANCE \
            -e SECURITY_YAMA \
            -e SECURITY_DMESG_RESTRICT \
            -e FORTIFY_SOURCE \
            -d SCHEDSTATS \
            -d SCHED_INFO
          echo "custom perf opts applied" >> "$LOG_FILE"'''
        assert anchor in s, "anchor not found"
        s = s.replace(anchor, inject, 1)
        open(p, "w").write(s)
        print("patched build.sh")
        PYEOF
        grep -n "custom perf opts" build.sh

    - name: Setup Toolchain (ZyC-Clang 15)
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -zxvf Clang-15.0.7-20251111.tar.gz

    - name: Build Kernel (lmi + KSU)
      run: |
        cd kernel
        chmod +x build.sh
        bash build.sh lmi ksu miui

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-lmi-KSU
        path: kernel/out/**/*.zip
        if-no-files-found: error
