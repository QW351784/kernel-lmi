name: Build Kernel - lmi

on:
  workflow_dispatch:
    inputs:
      rom:
        description: 'ROM type'
        required: true
        default: 'miui'
        type: choice
        options:
          - miui
          - aosp
          - both
      lto:
        description: 'LTO mode'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - thin
          - full

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI
        uses: actions/checkout@v4

      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b android16-aptusitu https://gitlab.com/kaixenberg/android_kernel_xiaomi_sm8250.git kernel

      - name: Upgrade CIP Base (try cip136)
        id: cipupgrade
        continue-on-error: true
        run: |
          cd kernel
          echo "=== current baseline ==="
          grep -m1 "CIP" Makefile | head -2 || true
          git remote add cip https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git 2>/dev/null || true
          echo "=== fetch cip136 (shallow) ==="
          timeout 240 git fetch --depth=1 cip refs/tags/v4.19.325-cip136:refs/tags/cip136-target 2>&1 | tail -5 || { echo "FETCH_FAILED"; exit 0; }
          echo "=== merge (no commit) ==="
          git -c user.email="ci@local" -c user.name="ci" merge --no-commit --no-ff cip136-target 2>&1 | tail -20
          echo "=== conflict list ==="
          git status --short | grep -E "^UU|^AA|^DU|^UD" | head -30 || echo "no conflicts"
          echo "=== conflict count ==="
          git status --short | grep -cE "^UU|^AA|^DU|^UD" || echo 0

      - name: Report CIP Upgrade Result
        run: |
          cd kernel
          echo "=== unresolved conflicts ==="
          git status --short | grep -cE "^UU|^AA|^DU|^UD" || echo 0
          if git status --short | grep -qE "^UU|^AA|^DU|^UD"; then
            echo "CIP_UPGRADE_CONFLICT=yes"
            git merge --abort || true
            echo "aborted merge, falling back to cip127 baseline"
          else
            echo "CIP_UPGRADE_CONFLICT=no"
          fi

      - name: Clone Submodules
        run: |
          git clone --depth=1 -b v4.2.0-rc3 https://github.com/Baka-SU/BakaSU.git bakasu
          ln -sfn $PWD/bakasu/kernel kernel/drivers/kernelsu
          git clone --depth=1 https://github.com/vc-teahouse/Baseband-guard.git kbg
          ln -sfn $PWD/kbg kernel/security/baseband-guard
          rm -rf kernel/anykernel
          git clone --depth=1 -b kona https://github.com/liyafe1997/AnyKernel3.git kernel/anykernel
          echo "--- verify ---"
          ls kernel/drivers/kernelsu/Kconfig kernel/security/baseband-guard/Kconfig
          ls kernel/anykernel/anykernel.sh kernel/anykernel/META-INF
          grep -n "device.name5" kernel/anykernel/anykernel.sh

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 libxml2-utils
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fix libxml2 for ld.lld
        run: |
          # runner 系统提供的是 libxml2.so.16，工具链 ld.lld 需要老的 .so.2
          LIBXML=$(ldconfig -p | grep -oP 'libxml2\.so\.\K[0-9]+' | head -1 || true)
          echo "system libxml2 soname: $LIBXML"
          if [ -n "$LIBXML" ] && [ "$LIBXML" != "2" ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libxml2.so.$LIBXML /usr/lib/x86_64-linux-gnu/libxml2.so.2
            sudo ldconfig
          fi
          echo "--- verify ---"
          ldconfig -p | grep "libxml2.so.2" || echo "STILL MISSING"


      - name: Setup Toolchain
        run: |
          sudo apt-get install -y zstd || true
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst
          tar --zstd -xf neutron-clang-06092026.tar.zst || (echo "tar --zstd failed, trying zstd -d" && zstd -d -c neutron-clang-06092026.tar.zst | tar -x)
          echo "--- layout check ---"
          CLANG_BIN=$(find $HOME/zyc-clang -maxdepth 3 -type f -name "clang" | head -1)
          echo "clang at: $CLANG_BIN"
          if [ -n "$CLANG_BIN" ] && [ "$CLANG_BIN" != "$HOME/zyc-clang/bin/clang" ]; then
            CLANG_DIR=$(dirname "$CLANG_BIN")
            rm -rf $HOME/zyc-clang/bin
            ln -sfn "$CLANG_DIR" $HOME/zyc-clang/bin
          fi
          ls -la $HOME/zyc-clang/bin/clang || (echo "final fallback search" && find $HOME/zyc-clang -maxdepth 4 -name "clang*" -type f | head -5)
          $HOME/zyc-clang/bin/clang --version || true

      - name: Apply Custom Optimizations
        run: |
          python3 .github/scripts/patch_build.py kernel/build.sh
          grep -n "custom perf opts" kernel/build.sh

      - name: Apply BakaSU Hook Patch
        run: |
          python3 .github/scripts/patch_hooks.py kernel
          echo "--- verify ---"
          grep -c "ksu_vfs_read_hook" kernel/fs/read_write.c || echo "clean"
          grep -n "ksu_handle_newfstat_ret" kernel/fs/stat.c | head -2

      - name: Apply clang21 Compatibility Patch
        run: |
          python3 .github/scripts/patch_clang21.py kernel
          echo "--- verify ---"
          grep -n "PAGE_SIZE" kernel/drivers/xiaomi/cpu_pcost.c | head -4
          grep -n "(QDF_STATUS)A_ERROR" kernel/drivers/staging/qca-wifi-host-cmn/hif/src/ce/ce_main.c | head -2

      - name: Apply Conservative Scheduler Tuning
        run: |
          python3 .github/scripts/patch_sched_conservative.py kernel
          echo "--- verify scheduler values ---"
          grep -n "sysctl_sched_latency\s*=\|sysctl_sched_min_granularity\s*=\|sysctl_sched_wakeup_granularity\s*=" kernel/kernel/sched/fair.c | head -6

      - name: Build Kernel
        run: |
          cd kernel
          chmod +x build.sh
          if [ "${{ inputs.rom }}" = "both" ]; then
            echo "building both AOSP + MIUI"
            bash build.sh lmi ksu
          elif [ "${{ inputs.lto }}" = "full" ]; then
            echo "full LTO: limiting jobs to 1 to reduce memory pressure"
            bash build.sh lmi ksu "${{ inputs.rom }}" -L full -J1
          else
            bash build.sh lmi ksu "${{ inputs.rom }}" -L ${{ inputs.lto }}
          fi

      - name: Verify Kernel Config
        if: always()
        run: |
          echo "=== out/.config 关键项 ==="
          for k in CONFIG_KSU CONFIG_KSU_MANUAL_HOOK CONFIG_SECURITY_YAMA CONFIG_SECURITY_DMESG_RESTRICT CONFIG_FORTIFY_SOURCE CONFIG_SCHEDSTATS CONFIG_SCHED_INFO CONFIG_DEBUG_KERNEL CONFIG_SCHED_DEBUG CONFIG_PROFILING CONFIG_LOCKDEP CONFIG_DEBUG_INFO CONFIG_KALLSYMS_ALL CONFIG_LOCALVERSION CONFIG_LTO CONFIG_CFI_CLANG; do
            printf "%-38s : %s\n" "$k" "$(grep -E "^${k}(=| is not set)" kernel/out/.config 2>/dev/null | head -1)"
          done
          echo "=== Image 版本串 ==="
          strings kernel/out/arch/arm64/boot/Image 2>/dev/null | grep -m1 "Linux version"
          echo "=== LTO thin 强校验（4.19 真名 CONFIG_THINLTO）==="
          grep -E "^CONFIG_THINLTO=y$|^CONFIG_LTO_NONE=y$" kernel/out/.config
          echo "=== Image 内嵌配置（真实）==="
          cp kernel/scripts/extract-ikconfig /tmp/eik 2>/dev/null; chmod +x /tmp/eik
          /tmp/eik kernel/out/arch/arm64/boot/Image 2>/dev/null | grep -E "^CONFIG_(LTO_CLANG_THIN|LTO_NONE|KSU|LOCALVERSION|SCHED_DEBUG|SCHEDSTATS|PROFILING)" | head -12
          echo "=== 归档 .config 供下载 ==="
          mkdir -p kernel/out/artifacts && cp kernel/out/.config kernel/out/artifacts/build.config && ls -lh kernel/out/artifacts/

      - name: Locate Artifacts
        if: always()
        run: |
          echo "=== zip 文件 ==="
          find . -name "*.zip" -not -path "*/.git/*" | head -20
          echo "=== out/lmi ==="
          ls -la kernel/out/lmi/ 2>/dev/null || echo "no kernel/out/lmi"

      - name: Publish Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kernel lmi ${{ inputs.rom }} #${{ github.run_number }}
          body: |
            rom: ${{ inputs.rom }}
            run: ${{ github.run_number }}
          files: |
            kernel/out/**/*.zip
            kernel/anykernel/*.zip
            **/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
