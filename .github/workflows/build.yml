name: Build Kernel - lmi CIP136 v2-Opt

on:
  workflow_dispatch:
    inputs:
      rom:
        description: 'ROM type'
        required: true
        default: 'miui'
        type: choice
        options:
          - miui
          - aosp
      lto:
        description: 'LTO mode'
        required: false
        default: 'thin'
        type: choice
        options:
          - none
          - thin
          - full

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DEVICE: lmi
      KERNEL_NAME: Nidhi-1.3.0
      VARIANT: ${{ inputs.rom }}
      LTO_MODE: ${{ inputs.lto }}
      JOBS: 2
    steps:
      - name: Checkout CI
        uses: actions/checkout@v4

      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - name: Clone Kernel (upstream nidhi, cip136)
        run: |
          git clone --recurse-submodules --shallow-submodules --depth=1 -b nidhi \
            https://github.com/kaixenberg/kernel_xiaomi_sm8250.git kernel
          cd kernel
          echo "=== baseline ==="
          echo "localversion-cip=[$(cat localversion-cip)] localversion-st=[$(cat localversion-st)]"
          grep -m1 SUBLEVEL Makefile || true
          echo "=== submodules ==="
          git submodule status || true
          echo "=== lmi configs ==="
          ls -d arch/arm64/configs/vendor/xiaomi/lmi.config arch/arm64/configs/lmi_defconfig || true
          echo "=== KSU pieces ==="
          ls -d KernelSU/kernel AnyKernel3/anykernel.sh 2>/dev/null || true
          grep -m1 'CONFIG_KSU=y' arch/arm64/configs/vendor/xiaomi/magictime-common.config || true

      - name: Switch KernelSU to SukiSU-Ultra
        working-directory: kernel
        run: |
          set -e
          rm -rf KernelSU
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          cd KernelSU
          echo "=== Ultra HEAD ==="
          git log -1 --format='%h %s'
          echo "=== uapi version ==="
          grep -n "KERNEL_SU_UAPI_VERSION" uapi/supercall.h | head -3
          echo "=== kernel entry files ==="
          ls kernel/Kconfig kernel/Makefile
          echo "=== KPM option present? ==="
          grep -n "config KPM" kernel/Kconfig
          echo "=== symlink intact? ==="
          ls -la ../drivers/kernelsu

      - name: Apply Kernel Tweaks (10 items)
        working-directory: kernel
        run: |
          set -e
          python3 "$GITHUB_WORKSPACE/patch_kernel.py"
          echo "=== 改后逐项抽查 ==="
          grep -n "= 600000ULL" kernel/sched/fair.c | head -2
          grep -n "PLACE_REL_DEADLINE, false" kernel/sched/features.h
          grep -n "RUN_TO_PARITY, false" kernel/sched/features.h
          grep -n "input_boost_ms = 120" drivers/cpufreq/cpu-boost.c
          grep -n "input_boost_freq = (cpu < 4)" drivers/cpufreq/cpu-boost.c
          grep -n "CONFIG_PANIC_TIMEOUT=5" arch/arm64/configs/lmi_defconfig
          grep -n "CONFIG_KPM=y" arch/arm64/configs/lmi_defconfig
          grep -n "CONFIG_KPROBES=y" arch/arm64/configs/vendor/xiaomi/magictime-common.config
          grep -n "KSU_SUSFS_ENABLE_LOG" arch/arm64/configs/vendor/xiaomi/magictime-common.config
          grep -n "thermal-mitigation = <3100000" arch/arm64/boot/dts/vendor/xiaomi/lmi-sm8250.dtsi
          grep -n "mi,pd-power-max = <36>" arch/arm64/boot/dts/vendor/xiaomi/lmi-sm8250.dtsi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio \
            libssl-dev ccache python-is-python3 libxml2-utils lz4 zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fix libxml2 for ld.lld
        run: |
          LIBXML=$(ldconfig -p | grep -oP 'libxml2\.so\.\K[0-9]+' | head -1 || true)
          echo "system libxml2 soname: $LIBXML"
          if [ -n "$LIBXML" ] && [ "$LIBXML" != "2" ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libxml2.so.$LIBXML /usr/lib/x86_64-linux-gnu/libxml2.so.2
            sudo ldconfig
          fi
          ldconfig -p | grep "libxml2.so.2" || echo "STILL MISSING"

      - name: Setup Toolchain (Neutron clang24)
        run: |
          mkdir -p $HOME/zyc-clang && cd $HOME/zyc-clang
          curl -sL -A "Mozilla/5.0" -o neutron.tar.zst \
            https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst
          ls -la neutron.tar.zst
          tar --zstd -xf neutron.tar.zst || (zstd -d -c neutron.tar.zst | tar -x)
          CLANG_DIR=$HOME/zyc-clang
          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            BINDIR=$(find "$HOME/zyc-clang" -maxdepth 3 -type d -name bin | head -1)
            [ -n "$BINDIR" ] || { echo "no bin dir after unpack"; find "$HOME/zyc-clang" -maxdepth 2 | head -20; exit 1; }
            CLANG_DIR=$(dirname "$BINDIR")
          fi
          echo "CLANG_DIR=$CLANG_DIR"
          [ -x "$CLANG_DIR/bin/clang" ] || { echo "unexpected layout: no $CLANG_DIR/bin/clang"; ls -la "$CLANG_DIR" | head -20; exit 1; }
          [ -x "$CLANG_DIR/bin/ld.lld" ] || { echo "no ld.lld in $CLANG_DIR/bin"; ls "$CLANG_DIR/bin" | head -30; exit 1; }
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          "$CLANG_DIR/bin/clang" --version | head -2
          "$CLANG_DIR/bin/ld.lld" --version

      - name: Prepare Build Switches
        working-directory: kernel
        run: |
          sed -i 's|    pipa) NAMES="pipa" ;;|    pipa) NAMES="pipa" ;;\n    lmi) NAMES="lmi" ;;|' build.sh
          grep -n "lmi) NAMES" build.sh
          DEF=arch/arm64/configs/lmi_defconfig
          case "$LTO_MODE" in
            thin)
              sed -i '/^CONFIG_THINLTO=y/d' $DEF
              echo "CONFIG_THINLTO=y" >> $DEF
              ;;
            none)
              sed -i 's/^CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' $DEF
              sed -i 's/^CONFIG_CFI_CLANG=y/# CONFIG_CFI_CLANG is not set/' $DEF
              sed -i 's/^CONFIG_SHADOW_CALL_STACK=y/# CONFIG_SHADOW_CALL_STACK is not set/' $DEF
              sed -i '/^CONFIG_LTO_NONE=y/d' $DEF
              echo "CONFIG_LTO_NONE=y" >> $DEF
              ;;
            full)
              sed -i '/^CONFIG_THINLTO=y/d' $DEF
              ;;
          esac
          echo "=== LTO lines in defconfig ==="
          grep -nE '^CONFIG_(LTO_CLANG|THINLTO|LTO_NONE|CFI_CLANG)=' $DEF || true
          echo "=== KSU line ==="
          grep -n "CONFIG_KSU=" arch/arm64/configs/vendor/xiaomi/magictime-common.config

      - name: Preflight Config Check
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 lmi_defconfig nidhi-variant.config 2>/dev/null || true
          cp arch/arm64/configs/vendor/xiaomi/magictime-common.config out/nidhi-preflight.config 2>/dev/null || true
          make O=out ARCH=arm64 lmi_defconfig 2>&1 | tail -10
          echo "=== 关键项 ==="
          grep -E '^CONFIG_(LTO_CLANG|THINLTO|CFI_CLANG|KSU|LOCALVERSION)=' out/.config || echo "(defconfig 里该项未出现)"

      - name: Build Kernel
        working-directory: kernel
        run: |
          set -o pipefail
          ./build.sh > /tmp/build_all.log 2>&1 || {
            echo "########## tail 40 ##########"
            tail -40 /tmp/build_all.log
            echo "########## ERRORS (last block, keep at output end) ##########"
            grep -n -B3 -A8 -i "error:" /tmp/build_all.log | tail -80 || echo "(no error: line found)"
            echo "########## END ##########"
            exit 1
          }
          tail -60 /tmp/build_all.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-fail
          path: /tmp/build_all.log
          retention-days: 3

      - name: Verify Artifacts
        working-directory: kernel
        run: |
          set -e
          REL=$(cat out/include/config/kernel.release)
          echo "RELEASE=$REL"
          case "$REL" in
            *cip136*) echo "CIP136_PRESENT";;
            *) echo "CIP136_MISSING"; exit 1;;
          esac
          echo "=== config proof ==="
          grep -E '^CONFIG_(LTO_CLANG|THINLTO|LTO_NONE|CFI_CLANG|KSU|KSU_MANUAL_HOOK|LOCALVERSION)=' out/.config || true
          echo "=== v2 优化项核验 ==="
          grep -E '^CONFIG_(KPM|KALLSYMS_ALL|FORTIFY_SOURCE|PANIC_TIMEOUT|KSU_SUSFS|KSU_SUSFS_ENABLE_LOG)=' out/.config || echo "(未全部出现)"
          echo "=== KSU 版本 ==="
          grep -ohs -- '-DKSU_VERSION=[0-9]*' out/drivers/kernelsu/.*.cmd out/drivers/kernelsu/*/.*.cmd 2>/dev/null | head -1 || echo "(未取到)"
          echo "=== zip ==="
          ZIP=$(ls out/*.zip | head -1)
          echo "ZIP=$ZIP"
          unzip -t "$ZIP" | tail -2
          unzip -l "$ZIP" | head -12
          echo "=== image ==="
          ls -la out/arch/arm64/boot/Image out/arch/arm64/boot/dtbo.img out/ak3/kernels/Image 2>/dev/null || true
          sha256sum out/arch/arm64/boot/Image
          echo "=== anykernel device names ==="
          grep -E '^(device\.name|kernel\.string)' out/ak3/anykernel.sh

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd kernel
          ZIP=$(ls out/*.zip | head -1)
          REL=$(cat out/include/config/kernel.release)
          TAG="build-cip136-$(date -u +%m%d%H%M)"
          gh release create "$TAG" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG lmi cip136" \
            --notes "uname: $REL / device: lmi / variant: $VARIANT / lto: $LTO_MODE / toolchain: Neutron clang 24.0.0git"
